name: Launcher Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    # jpackage's --type exe builds a real Windows installer via the WiX Toolset, which only makes
    # sense (and is only pre-installed) on a Windows runner - this cannot be cross-built from Linux.
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build installer
        run: ./gradlew.bat :launcher:jpackage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: launcher/build/jpackage/*.exe
          generate_release_notes: true
