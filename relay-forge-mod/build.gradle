// Standalone Forge 1.20.1 mod, deliberately isolated from the root project's Fabric Loom setup
// (different mod loader, different Minecraft version) - see Teil 2 of the friends-relay plan.
// ForgeGradle is not on the Gradle Plugin Portal, so it needs the legacy buildscript application
// instead of the plugins {} block used everywhere else in this repo.
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'

version = '1.0.0'
group = 'dev.catclient2.relayforge'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            jvmArg '-Dmixin.debug.export=true'
            jvmArg '-Dmixin.debug.verbose=true'
            jvmArg '-Dmixin.checks=true'
            mods {
                relayforge {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Pinned to the exact Forge build the real target server runs (confirmed from its own crash
    // report: "Forge: net.minecraftforge:47.4.10") - a mismatch here previously caused a
    // MixinTransformerError that broke unrelated mods (Immersive Engineering, Ars Nouveau, Create,
    // Ender IO) system-wide, not just this mod, so this version must track the server exactly.
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'

    // Needed to generate the mixin refmap at compile time - without it, @Accessor/@Shadow string
    // literals (e.g. "channel") stay as dev-mapped names and fail to resolve once reobfuscated for
    // a real server, which only runs SRG-named fields (confirmed: "channel" reobfuscates to
    // "f_129468_" per build/createMcpToSrg/output.tsrg - the exact field this mod's accessor needs).
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// The refmap maps each mixin's dev-mapped (Mojang) names to the SRG names the production server
// actually uses - createMcpToSrg's output.tsrg is ForgeGradle's own mapping file for this.
// ForgeGradle 6's own tasks only produce SRG->MCP in the classic .srg format (createSrgToMcp) and
// MCP->SRG in the newer tsrg2 format (createMcpToSrg) - Mixin AP 0.8.5 needs MCP->SRG in the classic
// .srg format, which neither task provides directly, so invert createSrgToMcp's output once per build.
tasks.register('invertSrgMapping') {
    dependsOn('createSrgToMcp')
    def input = file('build/createSrgToMcp/output.srg')
    def output = file('build/mcpToSrgClassic.srg')
    inputs.file(input)
    outputs.file(output)
    doLast {
        def clPattern = ~/^(CL|FD): (\S+) (\S+)$/
        def mdPattern = ~/^MD: (\S+) (\S.*\)\S*) (\S+) (\S.*\)\S*)$/
        output.withWriter('UTF-8') { writer ->
            input.eachLine { line ->
                def cl = clPattern.matcher(line)
                def md = mdPattern.matcher(line)
                if (cl.matches()) {
                    writer.writeLine("${cl.group(1)}: ${cl.group(3)} ${cl.group(2)}")
                } else if (md.matches()) {
                    writer.writeLine("MD: ${md.group(3)} ${md.group(4)} ${md.group(1)} ${md.group(2)}")
                } else {
                    writer.writeLine(line)
                }
            }
        }
    }
}

tasks.named('compileJava') {
    dependsOn('invertSrgMapping')
    doFirst {
        options.compilerArgs += [
            "-AreobfSrgFile=${project.file('build/mcpToSrgClassic.srg')}",
            "-AoutRefMapFile=${project.file('build/resources/main/relayforge.refmap.json')}"
        ]
    }
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "relay-forge-mod",
            "Specification-Vendor"    : "catclient2",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : "catclient2",
            "MixinConfigs"            : "relayforge.mixins.json"
        ])
    }
}
